name: Apply final Astra candidate
on:
  push:
    branches: [main]
    paths:
      - '.mentor-deploy/**'
      - '.github/workflows/apply-final-candidate.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace repository with audited candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .mentor-deploy/part*.b64 > /tmp/candidate.b64
          base64 -d /tmp/candidate.b64 > /tmp/candidate.zip
          rm -rf /tmp/candidate-extract /tmp/preserve
          mkdir -p /tmp/candidate-extract /tmp/preserve
          unzip -q /tmp/candidate.zip -d /tmp/candidate-extract
          root="$(find /tmp/candidate-extract -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$root"
          test -f "$root/index.html"
          test -f "$root/app.js"
          test -f "$root/curriculum.js"
          test -f "$root/manifest.webmanifest"
          test -d "$root/control"
          cp .github/workflows/pages.yml /tmp/preserve/pages.yml
          if [ -f CNAME ]; then cp CNAME /tmp/preserve/CNAME; fi
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .
          mkdir -p .github/workflows
          cp /tmp/preserve/pages.yml .github/workflows/pages.yml
          touch .nojekyll
          if [ -f /tmp/preserve/CNAME ]; then cp /tmp/preserve/CNAME CNAME; fi
          test -f index.html
          test -f app.js
          test -f curriculum.js
          test -d control
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy final Astra full-shell candidate"
          git push origin HEAD:main
