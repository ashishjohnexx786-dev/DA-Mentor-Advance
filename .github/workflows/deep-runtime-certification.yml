name: Deep Hosted Runtime Certification 2026
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deep-hosted-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Deep hosted C2A runtime checks
        shell: bash
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          rm -rf /tmp/deep-downloads && mkdir -p /tmp/deep-downloads
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support.ui import Select

          base=os.environ['BASE_URL']; downloads=Path('/tmp/deep-downloads')
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=390,844')
          o.add_experimental_option('prefs',{'download.default_directory':str(downloads),'download.prompt_for_download':False,'download.directory_upgrade':True})
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,30)
          def ready():
              w.until(lambda x:x.execute_script('return document.readyState')=='complete')
              w.until(lambda x:len(x.find_element(By.TAG_NAME,'body').text.strip())>40)
              time.sleep(.25)
          def click(el): d.execute_script('arguments[0].click()',el)
          def tab(name):
              el=w.until(lambda x:x.find_element(By.CSS_SELECTOR,f'#nav button[data-tab="{name}"]'))
              click(el); time.sleep(.18)
          def severe(): return [x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
          def close_extras():
              main=d.current_window_handle
              for h in list(d.window_handles):
                  if h!=main:
                      d.switch_to.window(h); d.close()
              d.switch_to.window(main)
          try:
              d.get(base+'?deepqa='+os.environ.get('GITHUB_SHA','')); ready()
              assert '/MENTOR_APP/' in d.current_url, f'root redirect failed: {d.current_url}'
              d.execute_script('localStorage.clear();location.reload()'); ready()

              # Responsive hosted rendering.
              for width,height in [(360,800),(390,844),(412,915),(768,1024),(1280,900)]:
                  d.set_window_size(width,height); time.sleep(.1)
                  sw=d.execute_script('return document.documentElement.scrollWidth'); iw=d.execute_script('return innerWidth')
                  assert sw<=iw+4, f'horizontal overflow at {width}px: {sw}>{iw}'

              # All 8 C2A tabs are clicked from fresh DOM nodes because each click re-renders nav.
              expected=['Today','Learn','Course','Repair','Evidence','Jobs','Reports','Settings']
              d.set_window_size(390,844)
              for name in expected: tab(name)
              assert not severe(), 'severe console errors during navigation'

              # AMOLED applies and persists across cold reload.
              tab('Settings')
              sel=w.until(lambda x:x.find_element(By.ID,'themeSel'))
              assert 'amoled' in [o.get_attribute('value') for o in sel.find_elements(By.TAG_NAME,'option')], 'AMOLED option missing'
              Select(sel).select_by_value('amoled'); time.sleep(.25)
              assert d.execute_script("return document.documentElement.dataset.theme")=='amoled','AMOLED not applied'
              d.refresh(); ready()
              assert d.execute_script("return document.documentElement.dataset.theme")=='amoled','AMOLED not persistent'

              # Study session survives reload and can be ended after reload.
              tab('Today'); b=w.until(lambda x:x.find_element(By.ID,'sessionBtn')); assert 'START' in b.text.upper(); click(b); time.sleep(1.1)
              d.refresh(); ready(); b=w.until(lambda x:x.find_element(By.ID,'sessionBtn')); assert 'END' in b.text.upper(),'study session did not persist'; click(b); time.sleep(.2)

              # Fresh lesson review is locked until a genuine attempt is saved.
              tab('Learn')
              lesson=w.until(lambda x:x.find_element(By.CSS_SELECTOR,'.lesson[data-id]'))
              rev=lesson.find_element(By.CSS_SELECTOR,'button[data-act="review"]'); assert not rev.is_enabled(),'fresh protected review unexpectedly enabled'
              attempt=lesson.find_element(By.CSS_SELECTOR,'button[data-act="attempt"]'); click(attempt); time.sleep(.2)
              lesson=w.until(lambda x:x.find_element(By.CSS_SELECTOR,'.lesson[data-id]'))
              rev=lesson.find_element(By.CSS_SELECTOR,'button[data-act="review"]'); assert rev.is_enabled(),'review did not unlock after saved attempt'; click(rev); time.sleep(.3); close_extras()
              lesson=w.until(lambda x:x.find_element(By.CSS_SELECTOR,'.lesson[data-id]'))
              retry=lesson.find_element(By.CSS_SELECTOR,'button[data-act="retry"]'); assert retry.is_enabled(),'changed retry did not unlock after review'; click(retry); time.sleep(.15)
              lesson=w.until(lambda x:x.find_element(By.CSS_SELECTOR,'.lesson[data-id]'))
              explain=lesson.find_element(By.CSS_SELECTOR,'button[data-act="explain"]'); assert explain.is_enabled(); click(explain); time.sleep(.15)
              lesson=w.until(lambda x:x.find_element(By.CSS_SELECTOR,'.lesson[data-id]'))
              master=lesson.find_element(By.CSS_SELECTOR,'button[data-act="master"]'); assert master.is_enabled(),'mastery did not unlock after explain-back'; click(master); time.sleep(.2)

              # Backup download, mutate harmless setting, restore exact saved state.
              tab('Reports')
              for p in downloads.glob('*'): p.unlink()
              click(w.until(lambda x:x.find_element(By.ID,'backupBtn')))
              backup=None
              for _ in range(60):
                  fs=list(downloads.glob('*.json'))
                  if fs: backup=max(fs,key=lambda p:p.stat().st_mtime); break
                  time.sleep(.1)
              assert backup and backup.stat().st_size>20,'backup JSON missing'
              obj=json.loads(backup.read_text(encoding='utf-8')); assert obj.get('theme')=='amoled','backup omitted AMOLED state'
              tab('Settings'); Select(w.until(lambda x:x.find_element(By.ID,'themeSel'))).select_by_value('light'); time.sleep(.2)
              assert d.execute_script("return document.documentElement.dataset.theme")=='light'
              tab('Reports'); inp=w.until(lambda x:x.find_element(By.ID,'restoreInput')); inp.send_keys(str(backup)); time.sleep(.6)
              assert d.execute_script("return document.documentElement.dataset.theme")=='amoled','restore did not restore saved theme'

              # Service worker controls the hosted app and cached shell survives an emulated offline reload.
              sw=d.execute_async_script("""const done=arguments[0]; if(!('serviceWorker' in navigator)){done({ok:false,why:'unsupported'});return;} const t=setTimeout(()=>done({ok:false,why:'timeout'}),15000); navigator.serviceWorker.ready.then(r=>{clearTimeout(t);done({ok:!!r.active,script:r.active?r.active.scriptURL:''})}).catch(e=>{clearTimeout(t);done({ok:false,why:String(e)})});""")
              assert sw.get('ok'),f'service worker not active: {sw}'
              d.refresh(); ready(); assert d.execute_script('return !!navigator.serviceWorker.controller'),'service worker not controlling reload'
              d.execute_cdp_cmd('Network.enable',{}); d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':True,'latency':0,'downloadThroughput':0,'uploadThroughput':0})
              d.refresh(); time.sleep(1); assert len(d.find_element(By.TAG_NAME,'body').text.strip())>40,'offline relaunch blank'
              d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1}); d.refresh(); ready()
              assert not severe(),'severe console errors after reconnect'
              print('DEEP HOSTED C2A RUNTIME PASS',d.current_url,'tabs',len(expected),'sw',sw.get('script',''))
          finally:
              try:d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1})
              except Exception: pass
              d.quit()
          PY
