name: Master Runtime Smoke 2026
on:
  push:
    branches: [main, runtime-candidate/semantic-rc3-rc5-2026-09-12, runtime-candidate/csv-byte-parity-fix-2026-09-12]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: master-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: C2A static topology and JS
        shell: bash
        run: |
          set -euo pipefail
          for f in MENTOR_APP/index.html MENTOR_APP/app.js MENTOR_APP/registry.js MENTOR_APP/manifest.webmanifest MENTOR_APP/service-worker.js; do test -s "$f"; done
          node --check MENTOR_APP/app.js
          node --check MENTOR_APP/registry.js
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.');app=root/'MENTOR_APP';texts=[p.read_text(errors='ignore') for p in app.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.json'}]
          refs=set()
          for t in texts: refs.update(x.rstrip('.,;:)}\"\'').split('#',1)[0] for x in re.findall(r'\.\./COURSE_MODULES/[A-Za-z0-9_./,()\- ]+',t))
          missing=[r for r in refs if not (app/r).resolve().is_file()]
          assert not missing,missing[:10]
          assert len(refs)==135,len(refs)
          p=Path('COURSE_MODULES/C2_09/01_CORE_TEACH/C2_09_CAPSTONE_PROMOTION_TEACHING_BOOK_RC1.pdf')
          assert p.is_file() and p.stat().st_size>100000,p
          print('PASS C2A topology 135 routes + RC3 capstone book present')
          PY
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: C2A browser runtime - mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/c2a-http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 2
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844');o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,25)
          def severe(): return [x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
          try:
              d.get('http://127.0.0.1:8765/MENTOR_APP/index.html');w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.4)
              d.execute_script('localStorage.clear();location.reload()');w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.5)
              assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+4,'mobile overflow'
              for t in ['Today','Learn','Course','Repair','Evidence','Jobs','Reports','Settings']:
                  el=d.find_element(By.CSS_SELECTOR,f'#nav button[data-tab="{t}"]');d.execute_script('arguments[0].click()',el);time.sleep(.14)
                  active=d.find_element(By.CSS_SELECTOR,f'#nav button[data-tab="{t}"]');assert 'active' in active.get_attribute('class').split(),t
                  assert d.find_element(By.ID,'main').text.strip(),t
                  err=severe();assert not err,(t,err[:5])
              el=d.find_element(By.CSS_SELECTOR,'#nav button[data-tab="Learn"]');d.execute_script('arguments[0].click()',el);time.sleep(.2)
              reviews=d.find_elements(By.CSS_SELECTOR,'.lesson [data-act="review"]');assert reviews and reviews[0].get_attribute('disabled') is not None,'fresh review not protected'
              sw=d.execute_async_script("""const done=arguments[0];const t=setTimeout(()=>done(false),12000);navigator.serviceWorker.ready.then(()=>{clearTimeout(t);done(true)}).catch(()=>{clearTimeout(t);done(false)});""");assert sw,'service worker not ready'
              err=severe();assert not err,err[:5]
              d.set_window_size(1280,900);d.refresh();w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.3)
              assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+4,'desktop overflow'
              err=severe();assert not err,err[:5]
              print('PASS C2A browser runtime')
          finally:d.quit()
          PY
      - name: Live Pages critical-byte parity
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          files=(MENTOR_APP/index.html MENTOR_APP/manifest.webmanifest MENTOR_APP/service-worker.js index.html COURSE_MODULES/C2_09/01_CORE_TEACH/C2_09_CAPSTONE_PROMOTION_TEACHING_BOOK_RC1.pdf)
          pass=0
          for attempt in $(seq 1 40); do
            ok=1
            for f in "${files[@]}"; do
              tmp="/tmp/live-$(basename "$f")"; curl -fsSL --retry 2 "${BASE}${f}?qa=${GITHUB_SHA}-${attempt}" -o "$tmp" || { ok=0; break; }
              [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "$tmp"|awk '{print $1}')" ]] || { ok=0; break; }
            done
            [[ "$ok" == 1 ]] && { pass=1; break; }; sleep 15
          done
          test "$pass" == 1
          echo 'PASS C2A live Pages parity including RC3 capstone book'
