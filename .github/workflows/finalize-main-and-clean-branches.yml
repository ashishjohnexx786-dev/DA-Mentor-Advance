name: Finalize main and clean branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-main-and-clean-branches.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore Course 2A runtime adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('curriculum.js')
          s=p.read_text()
          adapter=r'''

// Runtime adapter for the unified DE Mentor 2026 shell. Canonical data remains C2A_REGISTRY.
window.COURSE2=(window.C2A_REGISTRY?.phases||[]).map(p=>({
  id:p.id,
  name:p.name,
  hours:[p.minHours,p.maxHours],
  artifacts:p.routes||{},
  lessons:[...(p.coreLessonIds||[]),...(p.supplementIds||[])].map(id=>{
    const l=(window.C2A_REGISTRY.lessons||[]).find(x=>x.id===id);
    return {id:id,title:(l&&l.title)||id};
  })
}));
'''
          if 'window.COURSE2=' not in s:
              p.write_text(s+adapter)

          sw=Path('service-worker.js')
          if sw.exists():
              x=sw.read_text()
              x=re.sub(r"const CACHE='[^']+';","const CACHE='mentor-de-ux-final-2026-09-10-c2a-v6';",x,count=1)
              sw.write_text(x)
          PY
          node --check curriculum.js
          git config user.name "Ashish Course Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add curriculum.js service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Restore Course 2A runtime curriculum adapter"
            git push origin main
          fi
          for b in $(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}'); do
            if [ "$b" != "main" ]; then git push origin --delete "$b"; fi
          done
