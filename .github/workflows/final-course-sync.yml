name: Final Course Sync
on:
  push:
    paths:
      - '.github/workflows/final-course-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire final course sync layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          if 'course-sync.js' not in s:
              s=s.replace('</body>','<script src="course-sync.js"></script></body>')
              p.write_text(s)
          p=Path('service-worker.js'); s=p.read_text()
          if "'./course-sync.js'" not in s:
              if "'./theme-picker.js'" in s: s=s.replace("'./theme-picker.js'","'./theme-picker.js','./course-sync.js'")
              else: s=s.replace('];',",'./course-sync.js'];",1)
          s=re.sub(r"da-mentor-(?:pro|advance)-v[\w.\-]+","da-mentor-advance-v2.1",s)
          p.write_text(s)
          PY
          grep -q 'course-sync.js' index.html
          grep -q 'course-sync.js' service-worker.js
      - name: Commit
        run: |
          git config user.name 'DA Mentor Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Wire final Course 2 sync layer'
          git push
