name: Full Mentor System Audit 2026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full-system-audit-2026.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_NAME: DA Mentor Advance
  STORAGE_KEY: daMentorC2A2026_iqa1
  CORE_LESSONS: '114'
  FILTER_PL: 'true'
  CACHE_MARKER: mentor-de2026-final-2026-09-10-c2a-v9
  LIVE_URL: https://ashishjohnexx786-dev.github.io/DA-Mentor-Advance/
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static package and route integrity
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html curriculum.js assets-pack.js service-worker.js manifest.webmanifest; do test -s "$f"; done
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json,pathlib,re,subprocess,os
          h=pathlib.Path('index.html').read_text(); m=json.loads(pathlib.Path('manifest.webmanifest').read_text())
          for s in [os.environ['EXPECTED_NAME'],os.environ['STORAGE_KEY'],'id="homePracticeBtn"','id="practiceBtn"','data-open-practice-phase','Open Practice Set','START STUDY','END STUDY','Fresh retry','Mark Mastered']:
              assert s in h,s
          for bad in ['25:00','pomodoro','focusmin','shortmin','longmin']:
              assert bad not in h.lower(),bad
          assert os.environ['CACHE_MARKER'] in pathlib.Path('service-worker.js').read_text()
          for icon in m.get('icons',[]): assert pathlib.Path(icon['src']).exists(),icon['src']
          for i,x in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I)):
              if re.search(r'\bsrc\s*=',x.group(1),re.I): continue
              f=pathlib.Path(f'/tmp/inline-{i}.js');f.write_text(x.group(2));subprocess.run(['node','--check',str(f)],check=True)
          print('PASS static integrity')
          PY
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Full learner runtime audit phone and desktop
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          sleep 2
          python - <<'PY'
          import json,os,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          NAME=os.environ['EXPECTED_NAME'];KEY=os.environ['STORAGE_KEY'];EXPECT=int(os.environ['CORE_LESSONS']);FILTER=os.environ['FILTER_PL']=='true'
          o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=412,915');o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          def click(el):
              d.execute_script("arguments[0].scrollIntoView({block:'center',behavior:'instant'})",el);time.sleep(.12);el.click();time.sleep(.15)
          def nav(v):
              b=d.find_element(By.CSS_SELECTOR,f".tab[data-view='{v}']");click(b);assert 'active' in b.get_attribute('class').split(),v;assert d.find_element(By.ID,f'view-{v}').is_displayed(),v
          def state(): return json.loads(d.execute_script('return localStorage.getItem(arguments[0])',KEY))
          def severe(): return [x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
          try:
              d.get('http://127.0.0.1:8765/index.html');w.until(EC.title_contains(NAME));d.execute_script('localStorage.clear();location.reload()');w.until(EC.title_contains(NAME));time.sleep(.5)
              assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+3
              assert d.execute_script('return window.MENTOR_CONFIG.storageKey')==KEY
              course=d.execute_script('return window.MENTOR_CONFIG.getCourse()');ids=[l['id'] for p in course for l in p['lessons']];core=[x for x in ids if not(FILTER and x.startswith('PL'))];assert len(core)==EXPECT,(len(core),EXPECT)
              for p in course:
                  a=p.get('artifacts',{});assert a.get('lesson'),p['id'];assert a.get('practice'),p['id'];assert a.get('lab'),p['id'];assert all(a.get('gate'+g) for g in 'ABC'),p['id']
              missing=d.execute_script("""const a=window.MENTOR_ASSETS||{},m=[];for(const p of window.MENTOR_CONFIG.getCourse())for(const v of Object.values(p.artifacts||{}))for(const x of(Array.isArray(v)?v:[v])){if(!x||typeof x!=='string'||/^https?:/i.test(x))continue;let k=x.replace(/^\.\//,'');if(!a[x]&&!a[k])m.push(x)}return [...new Set(m)]""");assert not missing,missing[:10]
              for v in ['home','learn','course','repair','evidence','jobs','reports']:nav(v)
              nav('home');click(d.find_element(By.ID,'settingsBtn'));assert 'show' in d.find_element(By.ID,'settingsModal').get_attribute('class').split();assert d.execute_script("return [...themeInput.options].some(o=>o.value==='amoled')")
              d.execute_script("themeInput.value='amoled';nameInput.value='QA Learner'");click(d.find_element(By.ID,'saveSettingsBtn'));assert d.execute_script('return document.body.dataset.theme')=='amoled';assert state()['theme']=='amoled'
              click(d.find_element(By.ID,'setupCheckBtn'));rows=d.find_elements(By.CSS_SELECTOR,'#setupResults .setupResult');assert len(rows)>=6;assert all('🔴' not in x.text for x in rows),[x.text for x in rows];click(d.find_element(By.CSS_SELECTOR,"[data-close='setupModal']"))
              b=d.find_element(By.ID,'studyStartEnd');click(b);assert 'END STUDY' in b.text;time.sleep(1.1);click(b);assert 'START STUDY' in b.text;assert state()['study']['sessions'][-1]['seconds']>=1
              d.execute_script("window.__opens=0;window.open=()=>{window.__opens++;return {document:{write(){},close(){}}}}")
              click(d.find_element(By.ID,'homePracticeBtn'));assert d.execute_script('return __opens')>=1
              nav('learn');first=course[0]['lessons'][0]['id'];rev=d.find_element(By.ID,'reviewBtn');assert not rev.is_enabled();click(d.find_element(By.ID,'sourceBtn'));click(d.find_element(By.ID,'practiceBtn'));assert d.execute_script('return __opens')>=3
              click(d.find_element(By.ID,'guidedDoneBtn'));click(d.find_element(By.ID,'saveAttemptBtn'));assert d.find_element(By.ID,'reviewBtn').is_enabled();click(d.find_element(By.ID,'reviewBtn'));assert d.find_element(By.ID,'retestBtn').is_enabled();click(d.find_element(By.ID,'retestBtn'));assert d.find_element(By.ID,'explainBtn').is_enabled();click(d.find_element(By.ID,'explainBtn'));assert d.find_element(By.ID,'masterBtn').is_enabled();click(d.find_element(By.ID,'masterBtn'));assert state()['lesson'][first]['mastered']
              d.refresh();w.until(EC.title_contains(NAME));time.sleep(.4);assert state()['lesson'][first]['mastered'];assert state()['study']['sessions'];assert d.execute_script('return document.body.dataset.theme')=='amoled'
              nav('course');q=d.find_element(By.ID,'lessonSearch');q.send_keys(first);time.sleep(.2);assert first in d.find_element(By.ID,'stageMap').text;q.clear();d.execute_script("arguments[0].dispatchEvent(new Event('input',{bubbles:true}))",q);time.sleep(.2)
              d.execute_script("window.__opens=0;window.open=()=>{window.__opens++;return {document:{write(){},close(){}}}}")
              click(d.find_element(By.CSS_SELECTOR,'[data-open-practice-phase]'));assert d.execute_script('return __opens')>=1
              d.execute_script("""const k=arguments[0],p=MENTOR_CONFIG.getCourse()[0],s=JSON.parse(localStorage.getItem(k));for(const l of p.lessons)s.lesson[l.id]={guided:true,attempt:true,review:true,retest:true,explain:true,mastered:true,skipped:false};s.currentPhase=p.id;s.currentLesson=p.lessons[0].id;localStorage.setItem(k,JSON.stringify(s));""",KEY);d.refresh();w.until(EC.title_contains(NAME));time.sleep(.4);nav('course');pid=d.execute_script('return MENTOR_CONFIG.getCourse()[0].id')
              d.execute_script("window.__opens=0;window.open=()=>{window.__opens++;return {document:{write(){},close(){}}}}")
              lab=d.find_element(By.CSS_SELECTOR,f"[data-open-lab='{pid}']");assert lab.is_enabled();click(lab);click(d.find_element(By.CSS_SELECTOR,f"[data-lab-pass='{pid}']"));ga=d.find_element(By.CSS_SELECTOR,f"[data-open-gate='{pid}'][data-g='A']");assert ga.is_enabled();click(ga)
              gb=d.find_element(By.CSS_SELECTOR,f"[data-open-gate='{pid}'][data-g='B']");assert 'hidden' in gb.find_element(By.XPATH,'ancestor::div[contains(@class,"gateRow")]').get_attribute('class').split();d.execute_script("window.prompt=()=> 'NEEDS_REPAIR'");click(d.find_element(By.CSS_SELECTOR,f"[data-gate-result='{pid}'][data-g='A']"));click(w.until(EC.presence_of_element_located((By.CSS_SELECTOR,f"[data-assign='{pid}'][data-assign-g='B']"))));gb=d.find_element(By.CSS_SELECTOR,f"[data-open-gate='{pid}'][data-g='B']");assert gb.is_enabled();click(gb)
              d.execute_script("window.prompt=()=> 'NEEDS_REPAIR'");click(d.find_element(By.CSS_SELECTOR,f"[data-gate-result='{pid}'][data-g='B']"));click(w.until(EC.presence_of_element_located((By.CSS_SELECTOR,f"[data-assign='{pid}'][data-assign-g='C']"))));gc=d.find_element(By.CSS_SELECTOR,f"[data-open-gate='{pid}'][data-g='C']");assert gc.is_enabled()
              nav('repair');assert d.find_elements(By.CSS_SELECTOR,'#repairList .repairRow');nav('evidence');d.find_element(By.ID,'evSkill').send_keys('QA-SKILL');d.find_element(By.ID,'evAction').send_keys('Validated');click(d.find_element(By.ID,'addEvidenceBtn'));assert 'QA-SKILL' in d.find_element(By.ID,'evidenceList').text
              nav('jobs');d.execute_script("window.__pq=['QA Company','QA Role','Applied'];window.prompt=()=>window.__pq.shift()");click(d.find_element(By.ID,'addApplicationBtn'));assert 'QA Company' in d.find_element(By.ID,'applicationList').text
              nav('reports');assert d.find_element(By.ID,'exportJsonBtn').is_enabled() and d.find_element(By.ID,'exportLessonsBtn').is_enabled()
              assert not severe(),severe();assert d.execute_async_script("const cb=arguments[0];navigator.serviceWorker.ready.then(()=>cb(true)).catch(()=>cb(false))")
              d.set_window_size(1280,900);d.refresh();w.until(EC.title_contains(NAME));time.sleep(.4);assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+3;assert not severe(),severe()
              print('PASS full runtime audit')
          finally:d.quit()
          PY
          kill $(cat /tmp/http.pid)
      - name: Live Pages parity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            h=$(curl -fsSL "${LIVE_URL}?qa=${GITHUB_SHA}-${i}" || true);s=$(curl -fsSL "${LIVE_URL}service-worker.js?qa=${GITHUB_SHA}-${i}" || true)
            if grep -Fq "$EXPECTED_NAME" <<<"$h" && grep -Fq "$STORAGE_KEY" <<<"$h" && grep -Fq 'homePracticeBtn' <<<"$h" && grep -Fq 'data-open-practice-phase' <<<"$h" && grep -Fq "$CACHE_MARKER" <<<"$s";then ok=1;break;fi;sleep 5
          done
          test "$ok" = 1
          echo 'PASS live Pages parity'
