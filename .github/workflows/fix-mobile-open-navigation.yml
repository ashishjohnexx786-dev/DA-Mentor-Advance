name: Fix mobile Learn layout and open study navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-open-navigation.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply final common UX repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          p=Path('index.html'); s=p.read_text()
          old='<button class="btn ghost" id="practiceBtn">🧪 Practice</button></div></div><div class="teacherStep"><span>3</span>'
          new='<button class="btn ghost" id="practiceBtn">🧪 Practice</button></div></div></div><div class="teacherStep"><span>3</span>'
          assert s.count(old)==1; s=s.replace(old,new,1)
          pat=r"const phaseUnlocked=p=>\{const i=COURSE\.findIndex\(x=>x\.id===p\.id\);return i===0\|\|COURSE\.slice\(0,i\)\.every\(phaseComplete\)\};"
          s,n=re.subn(pat,"const phaseUnlocked=p=>true;",s,count=1); assert n==1
          s=s.replace("pass?'ok':phaseUnlocked(p)?'warn':'danger'","pass?'ok':'warn'")
          s=s.replace("pass?'PASS':phaseUnlocked(p)?'ACTIVE':'LOCKED'","pass?'PASS':'OPEN'")
          s=s.replace('Browse anything. Mentor still protects attempts, reviews and Gates.','All lessons and phases are open for study in any order. Mentor still protects attempts, reviews, Mini-Labs and Gates.')
          css='.teacherStep>div{min-width:0}@media(max-width:620px){.teacherStep{align-items:start}.teacherStep .btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}.teacherStep .actionRow{align-items:flex-start}}\n'
          assert css not in s; s=s.replace('</style>',css+'</style>',1); p.write_text(s)
          sw=Path('service-worker.js'); t=sw.read_text(); oldc='mentor-de-ux-direct-assets-2026-09-09-c2a-v2'; newc='mentor-de-ux-direct-assets-2026-09-09-c2a-v3'; assert t.count(oldc)==1; sw.write_text(t.replace(oldc,newc,1))
          m=json.loads(Path('DEPLOY_MANIFEST.json').read_text())
          for f in m['files']:
              b=Path(f['path']).read_bytes(); f['bytes']=len(b); f['sha256']=hashlib.sha256(b).hexdigest()
          m['runtimeFix']='LIVE_QA_STEP_RERENDER_2026_09_09'; m['mobileMarkupFix']='TEACHER_STEP_SIBLING_FIX_2026_09_09'; m['studyNavigation']='ALL_LESSONS_OPEN_ASSESSMENTS_PROTECTED'
          Path('DEPLOY_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          git config user.name 'Four-Course Final UX Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js DEPLOY_MANIFEST.json
          git commit -m 'Fix mobile Learn overlap and open lesson browsing'
          git push origin main
