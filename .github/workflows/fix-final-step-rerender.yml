name: Fix final Mentor step rerender
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-final-step-rerender.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply minimal C2A runtime fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('index.html'); s=p.read_text()
          old='save()}\nfunction switchView'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,'save();renderLearn()}\nfunction switchView',1)
          p.write_text(s)
          sw=Path('service-worker.js'); t=sw.read_text()
          oldc='mentor-de-ux-direct-assets-2026-09-09-c2a-v1'; newc='mentor-de-ux-direct-assets-2026-09-09-c2a-v2'
          assert t.count(oldc)==1
          sw.write_text(t.replace(oldc,newc,1))
          m=json.loads(Path('DEPLOY_MANIFEST.json').read_text())
          for f in m['files']:
              b=Path(f['path']).read_bytes(); f['bytes']=len(b); f['sha256']=hashlib.sha256(b).hexdigest()
          m['runtimeFix']='LIVE_QA_STEP_RERENDER_2026_09_09'
          Path('DEPLOY_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          git config user.name 'Four-Course Live QA Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js DEPLOY_MANIFEST.json
          git commit -m 'Fix C2A lesson-step live rerender and bump cache'
          git push origin main
