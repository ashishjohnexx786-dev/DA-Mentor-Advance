name: Final C2A Mentor 2026 QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical deploy manifest and file hashes
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('.'); m=json.loads((d/'DEPLOY_MANIFEST.json').read_text())
          assert m['mentor']=='C2A' and m['assetCount']==109
          assert m.get('runtimeFix')=='LIVE_QA_STEP_RERENDER_2026_09_09'
          assert m.get('mobileMarkupFix')=='TEACHER_STEP_SIBLING_FIX_2026_09_09'
          assert m.get('studyNavigation')=='ALL_LESSONS_OPEN_ASSESSMENTS_PROTECTED'
          for f in m['files']:
              b=(d/f['path']).read_bytes(); assert len(b)==f['bytes']; assert hashlib.sha256(b).hexdigest()==f['sha256']
          print('PASS canonical deploy hashes')
          PY
      - name: Curriculum packed assets UX mobile structure and cache
        run: |
          node --check curriculum.js
          node --check assets-pack.js
          node --check service-worker.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');let c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('curriculum.js','utf8'),c);
          const r=c.window.C2A_REGISTRY;if(r.coreLessonCount!==114||r.phaseCount!==10||r.supplementCount!==8)throw Error('C2A count mismatch');
          c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('assets-pack.js','utf8'),c);const a=c.window.MENTOR_ASSETS;if(Object.keys(a).length!==109)throw Error('asset count');
          for(const [k,v] of Object.entries(a)){const b=Buffer.from(v.b,'base64');if(v.m==='application/pdf'&&b.subarray(0,4).toString()!=='%PDF')throw Error(k)}
          const h=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('service-worker.js','utf8');
          for(const s of ['Today','Learn','Course','Repair','Evidence','Jobs','Reports','START STUDY','END STUDY','genuine attempt','Fresh retry','Explain','Mastered','URL.createObjectURL','daMentorPro.v1','save();renderLearn()}','const phaseUnlocked=p=>true;','All lessons and phases are open for study in any order.'])if(!h.includes(s))throw Error('missing '+s);
          if(h.includes('25:00')||h.toLowerCase().includes('pomodoro'))throw Error('obsolete timer');
          const bad='id="practiceBtn">🧪 Practice</button></div></div><div class="teacherStep"><span>3</span>';const good='id="practiceBtn">🧪 Practice</button></div></div></div><div class="teacherStep"><span>3</span>';
          if(h.includes(bad)||!h.includes(good))throw Error('teacher-step markup regression');
          if(!sw.includes('mentor-de-ux-direct-assets-2026-09-09-c2a-v3'))throw Error('cache mismatch');
          console.log('PASS C2A final mobile/open-study/protected-assessment/cache QA');
          NODE
      - name: HTTP serve smoke
        run: |
          python -m http.server 8765 >/tmp/http.log 2>&1 & p=$!; trap 'kill $p' EXIT; sleep 1
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
          curl -fsS http://127.0.0.1:8765/service-worker.js >/dev/null
          curl -fsS http://127.0.0.1:8765/assets-pack.js >/dev/null
